name: Industrial Telemetry Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Download Go Dependencies
      run: go mod download

    - name: Run Go Vet
      run: go vet ./...

    - name: Run Go Tests & Benchmarks
      run: |
        go test -v -race ./...
        go test -bench=. ./pkg/compressor
